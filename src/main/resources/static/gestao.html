<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stop Top - Gestão de Mensalistas</title>
  <link rel="stylesheet" href="/design/style.css">
</head>
<body>
  <nav>
    <div class="container">
      <div class="logo">
        <a href="/index.html" style="text-decoration: none; color: inherit; font-size: inherit; font-weight: inherit;">
          🅿️ Stop Top
        </a>
      </div>
      <ul>
        <li><a href="cadastroCliente.html">Cliente</a></li>
        <li><a href="pagamento.html">Pagamento</a></li>
        <li><a href="cadastroVeiculo.html">Veículo</a></li>
        <li><a href="gestao.html">Gestão</a></li>
        <li><a href="regras.html">Regras</a></li>
      </ul>
      <div class="navbar-right">
        <div class="nav-icons">
          <a href="index.html" title="Home">Home</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="panel">
      <h2 class="section-title">Gestão de Mensalistas e Planos</h2>
      
      <form id="gestaoForm" class="vehicle-form">
        <div class="form-grid">
          <div class="form-group" style="position: relative;">
            <label for="nomeMensalista">Nome do Cliente:</label>
            <input type="text" class="form-input" id="nomeMensalista" placeholder="Digite o nome para buscar..." required autocomplete="off">
            <div id="listaSugestoes" style="display:none; position: absolute; background: white; border: 1px solid #ccc; width: 100%; z-index: 1000; max-height: 200px; overflow-y: auto;"></div>
          </div>
          <div class="form-group">
            <label for="cpfCnpj">CPF/CNPJ:</label>
            <input type="text" class="form-input" id="cpfCnpj" readonly>
          </div>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label for="placaPrincipal">Placa do Veículo:</label>
            <input type="text" class="form-input" id="placaPrincipal" required>
          </div>
          <div class="form-group">
            <label for="tipoPlanoGestao">Tipo de Plano:</label>
            <select class="form-input" id="tipoPlanoGestao" required>
              <option value="AVULSO">AVULSO</option>
              <option value="DIARIO">DIÁRIO</option>
              <option value="MENSAL">MENSAL</option>
              <option value="TRIMESTRAL">TRIMESTRAL</option>
              <option value="SEMESTRAL">SEMESTRAL</option>
            </select>
          </div>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label for="dataInicio">Data de Início:</label>
            <input type="date" class="form-input" id="dataInicio" required>
          </div>
          <div class="form-group">
            <label for="dataFim">Data de Término:</label>
            <input type="date" class="form-input" id="dataFim" readonly>
          </div>
        </div>

        <button type="submit" class="btn-action btn-full">SALVAR ASSINATURA</button>
      </form>

      <div class="table-container" style="margin-top: 2rem;">
        <table class="inventory-table">
          <thead>
            <tr>
              <th>Nome</th>
              <th>Placa</th>
              <th>Plano</th>
              <th>Início</th>
              <th>Término</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-mensalistas">
            <!-- Dados carregados via JS -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Stop Top - Sistema de Estacionamento</p>
    <p style="font-size: 0.9rem; margin-top: 1rem;">Desenvolvido por: Rafael Adelungue, Gustavo Gonçalves, João Vitor Reis, Nathan Liberatti e Erick Yuji</p>
  </footer>

  <script src="/scripts/gestao.js"></script>
</body>
</html>
