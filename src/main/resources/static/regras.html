<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stop Top - Configuração de Regras</title>
  <link rel="stylesheet" href="/design/style.css">
</head>

<body>

  <nav>
    <div class="container">
      <div class="logo">
        <a href="/index.html" style="text-decoration: none; color: inherit; font-size: inherit; font-weight: inherit;">
          🅿️ Stop Top
        </a>
      </div>
      <ul>
        <li><a href="cadastroCliente.html">Cliente</a></li>
        <li><a href="pagamento.html">Pagamento</a></li>
        <li><a href="cadastroVeiculo.html">Veículo</a></li>
        <li><a href="gestao.html">Gestão</a></li>
        <li><a href="regras.html">Regras</a></li>
      </ul>
      <div class="navbar-right">
        <div class="nav-icons">
          <a href="index.html" title="Home">Home</a>
        </div>
      </div>
    </div>
  </nav>

  <div class="container">

    <div class="rules-header">
      <p class="section-title">Configuração de Regras</p>
    </div>

    <div class="panel">
      <div class="rules-grid">

        <div class="rule-card">
          <div class="rule-card-header">
            Parâmetros de Tarifação
          </div>

          <div class="rule-form-grid">
            <div class="rule-input-group">
              <label>Tempo Tolerância:</label>
              <div class="input-with-symbol">
                <input type="number" class="form-input pad-right" id="tempoTolerancia" placeholder="0" min="0" required>
                <span class="symbol-right">min</span>
              </div>
            </div>

            <div class="rule-input-group">
              <label>Valor Primeira Hora:</label>
              <div class="input-with-symbol">
                <span class="symbol-left">R$</span>
                <input type="number" step="0.01" class="form-input pad-left" id="valorPrimeiraHora" placeholder="0.00" min="0" required>
              </div>
            </div>

            <div class="rule-input-group">
              <label>Valor Demais Horas:</label>
              <div class="input-with-symbol">
                <span class="symbol-left">R$</span>
                <input type="number" step="0.01" class="form-input pad-left" id="valorDemaisHoras" placeholder="0.00" min="0" required>
              </div>
            </div>

            <div class="rule-input-group">
              <label>Valor Diário:</label>
              <div class="input-with-symbol">
                <span class="symbol-left">R$</span>
                <input type="number" step="0.01" class="form-input pad-left" id="valorDiario" placeholder="0.00" min="0" required>
              </div>
            </div>

            <div class="rule-input-group">
              <label>Valor Mensal:</label>
              <div class="input-with-symbol">
                <span class="symbol-left">R$</span>
                <input type="number" step="0.01" class="form-input pad-left" id="valorMensal" placeholder="0.00" min="0" required>
              </div>
            </div>

            <div class="rule-input-group">
              <label>Valor Trimestral:</label>
              <div class="input-with-symbol">
                <span class="symbol-left">R$</span>
                <input type="number" step="0.01" class="form-input pad-left" id="valorTrimestral" placeholder="0.00" min="0" required>
              </div>
            </div>

            <div class="rule-input-group">
              <label>Valor Semestral:</label>
              <div class="input-with-symbol">
                <span class="symbol-left">R$</span>
                <input type="number" step="0.01" class="form-input pad-left" id="valorSemestral" placeholder="0.00" min="0" required>
              </div>
            </div>
          </div>
        </div>

      </div>

      <button class="btn-action btn-full rules-save-btn" onclick="salvarRegras()">
        Salvar todas as regras
      </button>
    </div>

  </div>

  <footer>
    <p>&copy; 2026 Stop Top - Sistema de Estacionamento</p>
    <p style="font-size: 0.9rem; margin-top: 1rem;">Desenvolvido por: Rafael Adelungue, Gustavo Gonçalves, João
      Vitor Reis, Nathan Liberatti e Erick Yuji</p>
  </footer>

  <script>
    window.onload = function () {
      carregarRegras();
    };

    function carregarRegras() {
      fetch('/api/regras')
        .then(response => response.json())
        .then(data => {
          if (data && data.id) {
            document.getElementById('tempoTolerancia').value = data.tempoTolerancia || 0;
            document.getElementById('valorPrimeiraHora').value = data.valorPrimeiraHora || 0;
            document.getElementById('valorDemaisHoras').value = data.valorDemaisHoras || 0;
            document.getElementById('valorDiario').value = data.valorDiario || 0;
            document.getElementById('valorMensal').value = data.valorMensal || 0;
            document.getElementById('valorTrimestral').value = data.valorTrimestral || 0;
            document.getElementById('valorSemestral').value = data.valorSemestral || 0;
          }
        })
        .catch(error => console.error('Erro ao carregar regras:', error));
    }

    function salvarRegras() {
      const tempoTolerancia = document.getElementById('tempoTolerancia').value;
      const valorPrimeiraHora = document.getElementById('valorPrimeiraHora').value;
      const valorDemaisHoras = document.getElementById('valorDemaisHoras').value;
      const valorDiario = document.getElementById('valorDiario').value;
      const valorMensal = document.getElementById('valorMensal').value;
      const valorTrimestral = document.getElementById('valorTrimestral').value;
      const valorSemestral = document.getElementById('valorSemestral').value;

      if (tempoTolerancia < 0 || valorPrimeiraHora < 0 || valorDemaisHoras < 0 || valorDiario < 0 || valorMensal < 0 || valorTrimestral < 0 || valorSemestral < 0) {
        alert('Os valores não podem ser negativos.');
        return;
      }

      const regras = {
        tempoTolerancia: parseInt(tempoTolerancia),
        valorPrimeiraHora: parseFloat(valorPrimeiraHora),
        valorDemaisHoras: parseFloat(valorDemaisHoras),
        valorDiario: parseFloat(valorDiario),
        valorMensal: parseFloat(valorMensal),
        valorTrimestral: parseFloat(valorTrimestral),
        valorSemestral: parseFloat(valorSemestral)
      };

      fetch('/api/regras', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(regras)
      })
        .then(response => {
          if (response.ok) {
            alert('Regras salvas com sucesso!');
          } else {
            alert('Erro ao salvar as regras. Verifique o console.');
          }
        })
        .catch(error => console.error('Erro:', error));
    }
  </script>

</body>

</html>
